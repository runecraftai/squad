<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Squad — talk to one agent, deploy with a squad</title>
  <desc id="desc">Agent distro hero: on the left the Squad name, tagline and metadata; on the right a squad board showing the sergeant at arms dispatching operators (sq-task-1 strike working, sq-task-2 recon done, sq-task-3 strike queued) and the delivery footer with a ready PR and a recon report.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1018"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="boardglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161F"/>
      <stop offset="1" stop-color="#0D1219"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#1E2733" stroke-width="1.5"/>

  <!-- ============================== title block ============================== -->
  <g id="title-block" transform="translate(56 52)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" letter-spacing="4" fill="#3FB950">&#9656; AGENT DISTRO</text>
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="#E6EDF3">Squad</text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#C9D1D9">Talk to one agent.</text>
    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#C9D1D9">Deploy with a <tspan fill="#3FB950">squad</tspan>.</text>

    <line x1="0" y1="214" x2="600" y2="214" stroke="#1E2733" stroke-width="1.5"/>

    <text x="0" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B949E">$ pi</text>
    <text x="0" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#C9D1D9">spawn two operators: fix login + recon flaky tests</text>
    <text x="0" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#3FB950">&#9656; PR ready for review, commander: #42</text>
  </g>

  <g id="metadata" transform="translate(56 372)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B949E">MIT</text>
    <circle cx="52" cy="-6" r="2" fill="#2D3542"/>
    <text x="66" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B949E">macOS / Linux</text>
    <circle cx="212" cy="-6" r="2" fill="#2D3542"/>
    <text x="226" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B949E">6 harnesses</text>
    <circle cx="392" cy="-6" r="2" fill="#2D3542"/>
    <text x="406" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B949E">5 backends</text>
  </g>

  <!-- ============================== squad board ============================== -->
  <g id="squad-board" transform="translate(712 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="432" height="340" rx="14" fill="url(#boardglow)" stroke="#232D3B" stroke-width="1.5"/>

    <!-- board header -->
    <rect x="0" y="0" width="432" height="46" rx="14" fill="#0E141C"/>
    <rect x="0" y="32" width="432" height="14" fill="#0E141C"/>
    <circle cx="20" cy="23" r="6" fill="#F85149"/>
    <circle cx="42" cy="23" r="6" fill="#D29922"/>
    <circle cx="64" cy="23" r="6" fill="#3FB950"/>
    <text x="88" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" letter-spacing="2" fill="#8B949E">SQUAD BOARD</text>
    <text x="412" y="29" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#3FB950">3 live</text>

    <!-- task row 1: strike working -->
    <g transform="translate(16 70)">
      <rect x="0" y="0" width="400" height="66" rx="10" fill="#0E141C" stroke="#1E2733" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#3FB950"/>
      <text x="30" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">sq-task-1</text>
      <text x="168" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3FB950">STRIKE</text>
      <text x="268" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">working</text>
      <text x="16" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9D1D9">$ fix flaky login test</text>
    </g>

    <!-- task row 2: recon done -->
    <g transform="translate(16 148)">
      <rect x="0" y="0" width="400" height="66" rx="10" fill="#0E141C" stroke="#1E2733" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#8B949E"/>
      <text x="30" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">sq-task-2</text>
      <text x="168" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#D29922">RECON</text>
      <text x="268" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">done</text>
      <text x="16" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9D1D9">data/sq-task-2/report.md</text>
    </g>

    <!-- task row 3: strike queued -->
    <g transform="translate(16 226)">
      <rect x="0" y="0" width="400" height="66" rx="10" fill="#0E141C" stroke="#1E2733" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#2D3542"/>
      <text x="30" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">sq-task-3</text>
      <text x="168" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3FB950">STRIKE</text>
      <text x="268" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">queued</text>
      <text x="16" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9D1D9">$ add dark mode</text>
    </g>

    <!-- delivery footer -->
    <g transform="translate(16 312)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">&#9660; deliver to commander</text>
      <text x="220" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#3FB950">PR #42</text>
      <text x="296" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">&#183;</text>
      <text x="312" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#C9D1D9">report.md</text>
    </g>
  </g>
</svg>
