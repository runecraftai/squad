name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/sq-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (file set + config + version). Do not
      # re-spell the shellcheck command here; keep CI and the pre-push gate on it.
      - run: bin/sq-lint.sh

  # Deterministic proof that portable parallel shards + portable serial + Herdr
  # equal the complete tests/*.test.sh inventory with no missing or duplicates,
  # and that the portable serial CI shards partition that serial lane exactly.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/sq-test-run.sh --check-coverage

  # Two duration-balanced portable parallel shards of the Phase 2 proven-isolated
  # set only. Composition owner: bin/sq-test-run.sh (docs/sq-test-portable-shards.md).
  tests-portable-parallel-1:
    name: Behavior portable parallel 1
    runs-on: ubuntu-latest
    # Measured shard wall is ~1 min of serial sum on proven scripts; this cap is
    # a hang tripwire with margin, not the expected healthy end of the lane.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/sq-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi (forked sq-tasks-axi, M2)
        run: |
          set -eu
          npm install -g ./packages/tasks-axi
          # Backward-compat alias: the distro and its tests invoke the backlog
          # backend by the protocol name `tasks-axi`; the fork's own bin is
          # `sq-tasks-axi` (AD-006).
          ln -s "$(command -v sq-tasks-axi)" "$(dirname "$(command -v sq-tasks-axi)")/tasks-axi"
          tasks-axi --version
          sq-tasks-axi --version
      - name: Run portable parallel shard 1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/sq-test"
          bin/sq-test-run.sh --lane portable-parallel-1 \
            --json "$RUNNER_TEMP/sq-test/sq-test-timing-portable-parallel-1.json"
      - name: Upload shard 1 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq-test-timing-portable-parallel-1
          path: ${{ runner.temp }}/sq-test/sq-test-timing-portable-parallel-1.json
          if-no-files-found: warn

  tests-portable-parallel-2:
    name: Behavior portable parallel 2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/sq-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi (forked sq-tasks-axi, M2)
        run: |
          set -eu
          npm install -g ./packages/tasks-axi
          # Backward-compat alias: the distro and its tests invoke the backlog
          # backend by the protocol name `tasks-axi`; the fork's own bin is
          # `sq-tasks-axi` (AD-006).
          ln -s "$(command -v sq-tasks-axi)" "$(dirname "$(command -v sq-tasks-axi)")/tasks-axi"
          tasks-axi --version
          sq-tasks-axi --version
      - name: Run portable parallel shard 2
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/sq-test"
          bin/sq-test-run.sh --lane portable-parallel-2 \
            --json "$RUNNER_TEMP/sq-test/sq-test-timing-portable-parallel-2.json"
      - name: Upload shard 2 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq-test-timing-portable-parallel-2
          path: ${{ runner.temp }}/sq-test/sq-test-timing-portable-parallel-2.json
          if-no-files-found: warn

  # Required portable serial remainder: sentry, lock, AFK, tmux, daemon,
  # ambiguous, and other stateful tests. Real Herdr stays in tests-herdr.
  # Split across separate runners so no two of these stateful scripts ever share
  # a machine: each shard is still strictly serial in itself. Shard membership
  # and the shard count both belong to bin/sq-test-run.sh, which refuses a lane
  # whose "ofN" disagrees with it (docs/sq-test-portable-shards.md).
  tests-portable-serial:
    name: Behavior portable serial ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Measured whole remainder is ~19 min of serial work; the balanced shards
    # are ~4.8 min each. Cap is a hang tripwire with roughly 3x margin, not the
    # expected healthy end of the lane.
    timeout-minutes: 15
    strategy:
      # Every shard reports so one failure never hides another shard's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/sq-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - name: Install tasks-axi for backlog-handoff delegation (forked sq-tasks-axi, M2)
        run: |
          set -eu
          npm install -g ./packages/tasks-axi
          ln -s "$(command -v sq-tasks-axi)" "$(dirname "$(command -v sq-tasks-axi)")/tasks-axi"
          tasks-axi --version
          sq-tasks-axi --version
      - name: Run portable serial shard ${{ matrix.shard }}
        env:
          # job-total rather than a literal, so shrinking or growing the matrix
          # without matching bin/sq-test-run.sh is refused instead of quietly
          # leaving a shard of the required lane unrun.
          SQUAD_SERIAL_LANE: portable-serial-${{ matrix.shard }}of${{ strategy.job-total }}
          SQUAD_SERIAL_SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/sq-test"
          bin/sq-test-run.sh --lane "$SQUAD_SERIAL_LANE" \
            --json "$RUNNER_TEMP/sq-test/sq-test-timing-portable-serial-${SQUAD_SERIAL_SHARD}.json"
      - name: Upload portable serial shard ${{ matrix.shard }} timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq-test-timing-portable-serial-${{ matrix.shard }}
          path: ${{ runner.temp }}/sq-test/sq-test-timing-portable-serial-${{ matrix.shard }}.json
          if-no-files-found: warn

  # Required real-Herdr lane: pinned install, serial real-herdr-gated family,
  # hard-fail on "skip: herdr not found". Starts on Linux x86_64; if a genuine
  # platform invariant fails (focus, cleanup, default-session tripwire), keep
  # the failure evidence and move the job to macOS rather than skip assertions.
  tests-herdr:
    name: Behavior tests (Herdr)
    runs-on: ubuntu-latest
    # Real Herdr is slower than the portable suite; this is a hang tripwire,
    # not the expected healthy end of the lane (estimate 15-40 min first cut).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tools for real Herdr
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is required"; exit 1; }
          jq --version
          python3 --version
      - name: Install pinned Herdr
        run: |
          set -eu
          bin/sq-install-herdr.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned FOB
        run: |
          set -eu
          # Several real-herdr-gated E2E scripts require fob for spawn
          # worktree acquisition (presentation, workspace-per-home, autodetect).
          bin/sq-install-fob.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assert Herdr pin and protocol floor
        run: |
          set -eu
          command -v herdr >/dev/null || { echo "::error::herdr not on PATH after install"; exit 1; }
          command -v fob >/dev/null || { echo "::error::fob not on PATH after install"; exit 1; }
          herdr --version
          fob --version
          status=$(herdr status --json)
          printf '%s\n' "$status"
          version=$(printf '%s' "$status" | jq -r '.client.version // empty')
          protocol=$(printf '%s' "$status" | jq -r '.client.protocol // empty')
          [ "$version" = "0.7.4" ] || {
            echo "::error::expected exact Herdr pin 0.7.4, got ${version:-<empty>}"
            exit 1
          }
          case "$protocol" in
            ''|*[!0-9]*) echo "::error::could not read client protocol"; exit 1 ;;
          esac
          [ "$protocol" -ge 16 ] || {
            echo "::error::herdr protocol $protocol is below the required floor 16"
            exit 1
          }
      - name: Start default Herdr session for unit-state tripwire
        run: |
          set -eu
          # Lab provision requires exactly one running default session so the
          # default-session tripwire can arm. Start it headless; never use it
          # for lab work (tests still refuse default and use sq-lab-* only).
          mkdir -p "$RUNNER_TEMP/sq-herdr"
          nohup herdr server >"$RUNNER_TEMP/sq-herdr/default-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/sq-herdr/default-server.pid"
          attempt=0
          while [ "$attempt" -lt 150 ]; do
            running=$(herdr status --json 2>/dev/null | jq -r '.server.running // false' || echo false)
            if [ "$running" = true ]; then
              herdr session list --json | jq -e '
                [.sessions[]? | select(.default == true and .name == "default" and .running == true)]
                | length == 1
              ' >/dev/null
              echo "default Herdr session is running"
              exit 0
            fi
            sleep 0.2
            attempt=$((attempt + 1))
          done
          echo "::error::default Herdr server did not become ready"
          cat "$RUNNER_TEMP/sq-herdr/default-server.log" || true
          exit 1
      - name: Snapshot pre-suite Herdr sessions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/sq-herdr"
          bin/sq-herdr-ci-cleanup.sh snapshot "$RUNNER_TEMP/sq-herdr/sessions-before.json"
      - name: Run real-Herdr family (serial, required)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/sq-test"
          # Serial only. Fail if any script reports herdr not found. Live
          # harness credential tests stay outside this family (opt-in env only).
          bin/sq-test-run.sh --family real-herdr-gated \
            --fail-on-gate-skip 'herdr not found' \
            --json "$RUNNER_TEMP/sq-test/sq-test-timing-herdr.json"
      - name: Cleanup job-owned Herdr lab sessions
        if: always()
        run: |
          set -eu
          bin/sq-herdr-ci-cleanup.sh teardown "$RUNNER_TEMP/sq-herdr/sessions-before.json" || {
            echo "::warning::lab session cleanup reported a problem; see logs"
            # Surface diagnostics without weakening the suite result above.
            herdr session list --json || true
            exit 1
          }
      - name: Upload Herdr timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq-test-timing-herdr
          path: |
            ${{ runner.temp }}/sq-test/sq-test-timing-herdr.json
            ${{ runner.temp }}/sq-herdr/sessions-before.json
            ${{ runner.temp }}/sq-herdr/default-server.log
          if-no-files-found: warn

  # Aggregate per-lane timing into one summary artifact for critical-path review.
  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    needs:
      - tests-portable-parallel-1
      - tests-portable-parallel-2
      - tests-portable-serial
      - tests-herdr
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download lane timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sq-test-timing-*
          path: ${{ runner.temp }}/sq-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/sq-test"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/sq-test-aggregate/sq-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-lane timing JSON found to aggregate"
            exit 0
          fi
          bin/sq-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/sq-test/sq-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq-test-timing-aggregate
          path: ${{ runner.temp }}/sq-test/sq-test-timing-aggregate.json
          if-no-files-found: warn

  macos-stock-bash:
    name: Stock macOS Bash snapshot compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run snapshot consumers with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }

          shell_inventory="$RUNNER_TEMP/sq-shell-inventory"
          bin/sq-lint.sh --list-files > "$shell_inventory"
          parse_fail=0
          while IFS= read -r f; do
            /bin/bash -n "$f" || { echo "::error::stock macOS Bash 3.2 failed to parse $f"; parse_fail=1; }
          done < "$shell_inventory"
          [ "$parse_fail" -eq 0 ] || { echo "::error::stock macOS Bash 3.2 parse sweep failed"; exit 1; }

          snapshot_output=$(/bin/bash tests/sq-unit-snapshot-view.test.sh)
          printf '%s\n' "$snapshot_output"
          snapshot_count=$(printf '%s\n' "$snapshot_output" | grep -c '^ok - ')
          [ "$snapshot_count" -eq 15 ] || {
            echo "::error::expected 15 snapshot/unit-view tests, got $snapshot_count"
            exit 1
          }

          bearings_output=$(/bin/bash tests/sq-sitrep-snapshot.test.sh)
          printf '%s\n' "$bearings_output"
          bearings_count=$(printf '%s\n' "$bearings_output" | grep -c '^ok - ')
          [ "$bearings_count" -eq 41 ] || {
            echo "::error::expected 41 Sitrep tests, got $bearings_count"
            exit 1
          }

  go-build-test:
    name: Go packages build + test (fob, no-mistakes)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/fob/go.mod
      - name: Install Turbo
        run: npm install -g turbo
      - name: Build fob + no-mistakes
        run: npx turbo run build --filter=fob --filter=no-mistakes
      - name: Go test per package
        run: |
          set -eu
          (cd packages/fob && go test ./...)
          (cd packages/no-mistakes && go test ./...)

  tasks-axi:
    name: tasks-axi fork build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install and build the fork
        run: |
          set -eu
          cd packages/tasks-axi
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Fork test suite
        run: |
          set -eu
          cd packages/tasks-axi
          pnpm run test
      - name: npm pack dry-run (renamed bin + artifacts)
        run: |
          set -eu
          cd packages/tasks-axi
          npm pack --dry-run 2>&1 | grep -E 'sq-tasks-axi|dist/bin'

  pi-smoke:
    name: Headless Pi extension load (optional)
    runs-on: ubuntu-latest
    if: ${{ env.PI_SMOKE != '' }}
    env:
      PI_SMOKE: ${{ vars.PI_SMOKE }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent
      - name: Install workspace deps
        run: bun install
      - name: Headless session loads extensions
        run: |
          set -eu
          printf 'Respond with exactly: PI_EXT_LOAD_OK\n' | \
            pi --offline --approve --no-context-files --no-skills --no-prompt-templates 2>/dev/null \
            | grep -F 'PI_EXT_LOAD_OK'


  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink CLAUDE.md)" = "AGENTS.md" ] || { echo "::error::CLAUDE.md must be a symlink to AGENTS.md"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal unit paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal unit paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
