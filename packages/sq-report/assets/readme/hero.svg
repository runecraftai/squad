<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">sq-report: the after-action debrief for agent-generated HTML artifacts</title>
  <desc id="desc">An HTML artifact card shows a plan heading, a paragraph with an annotated selection, a small diagram, and a queue-feedback bar; a debriefed stamp marks the review, and an annotation pin marks the selection.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- unit insignia: star in a ring -->
  <g id="unit-patch" transform="translate(48 36)">
    <circle r="16" fill="#0d0d12" stroke="#3a3a46" stroke-width="1.5"/>
    <path d="M0 -8.5 L2.63 -2.63 L8.08 -2.63 L3.72 1.01 L5.31 6.87 L0 3.4 L-5.31 6.87 L-3.72 1.01 L-8.08 -2.63 L-2.63 -2.63 Z" fill="#c9cdd6"/>
  </g>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(56 104)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9b9ba8" letter-spacing="2">AFTER-ACTION REPORT · ARTIFACT REVIEW</text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="84" font-weight="700" fill="#f1f1f5">sq-report</text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c9c9d2">The debrief for agent-built artifacts.</text>
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c9c9d2">Review rich artifacts, send feedback back.</text>
    <text x="0" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b8b98">sq-report · annotate · poll · share</text>
  </g>

  <!-- right: artifact card -->
  <g id="artifact" transform="translate(636 40)">
    <rect width="510" height="300" rx="14" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e6e8ee">artifact.html</text>
    <text x="486" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#8b8b98" text-anchor="end">sq-report</text>
    <line x1="16" y1="46" x2="494" y2="46" stroke="#2b2b35" stroke-width="1.5"/>

    <!-- debriefed stamp -->
    <g transform="translate(466 128) rotate(-8)" text-anchor="end">
      <rect x="-128" y="-16" width="128" height="34" rx="4" fill="none" stroke="#9aa0ac" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="-16" y="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#c9cdd6" letter-spacing="2">DEBRIEFED</text>
    </g>

    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#f1f1f5">Product plan, Q3</text>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#b9b9c4">
      <text x="24" y="106">We ship the signup flow first, then the</text>
      <text x="24" y="128">billing page, then the dashboard.</text>
    </g>

    <rect x="24" y="94" width="196" height="17" rx="3" fill="#b7a06a" opacity="0.3"/>
    <circle cx="250" cy="101" r="11" fill="#b7a06a"/>
    <text x="250" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#0d0d12" text-anchor="middle">1</text>

    <rect x="24" y="158" width="462" height="72" rx="8" fill="#0d0d12" stroke="#2b2b35" stroke-width="1.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <rect x="44" y="180" width="96" height="28" rx="6" fill="#16161d" stroke="#3a3a46" stroke-width="1.5"/>
      <text x="92" y="198" fill="#e6e8ee" text-anchor="middle">signup</text>
      <text x="158" y="196" fill="#8b8b98">→</text>
      <rect x="184" y="180" width="96" height="28" rx="6" fill="#16161d" stroke="#3a3a46" stroke-width="1.5"/>
      <text x="232" y="198" fill="#e6e8ee" text-anchor="middle">billing</text>
      <text x="298" y="196" fill="#8b8b98">→</text>
      <rect x="324" y="180" width="116" height="28" rx="6" fill="#16161d" stroke="#3a3a46" stroke-width="1.5"/>
      <text x="382" y="198" fill="#e6e8ee" text-anchor="middle">dashboard</text>
      <text x="44" y="222" fill="#8b8b98">editable mermaid diagram</text>
    </g>

    <rect x="24" y="248" width="462" height="40" rx="10" fill="#16161d" stroke="#3a3a46" stroke-width="1.5"/>
    <text x="40" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c9cdd6">Queue feedback → send to agent</text>
  </g>
</svg>
