<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">drill: run your push through a local AI validation exercise and land a clean PR</title>
  <desc id="desc">A terminal panel shows git push drill, then a pipeline of green checks for review, test, docs, and lint, ending in a push to origin and an opened pull request; a crosshair reticle marks the exercise.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- unit insignia: star in a ring -->
  <g id="unit-patch" transform="translate(48 36)">
    <circle r="16" fill="#0d0d12" stroke="#3a3a46" stroke-width="1.5"/>
    <path d="M0 -8.5 L2.63 -2.63 L8.08 -2.63 L3.72 1.01 L5.31 6.87 L0 3.4 L-5.31 6.87 L-3.72 1.01 L-8.08 -2.63 L-2.63 -2.63 Z" fill="#c9cdd6"/>
  </g>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(64 104)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9b9ba8" letter-spacing="2">FIRE TRAINING · VALIDATION PIPELINE</text>
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="96" font-weight="700" fill="#f1f1f5">drill</text>
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#c9c9d2">Every push runs the exercise.</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#c9c9d2">Land a clean PR, already reviewed.</text>
    <text x="0" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b8b98">git push drill · three ways in · agents</text>
  </g>

  <!-- right: terminal card -->
  <g id="terminal" transform="translate(632 36)">
    <rect width="504" height="300" rx="14" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="24" r="6" fill="#febc2e"/>
    <circle cx="72" cy="24" r="6" fill="#28c840"/>
    <text x="112" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b8b98">git push drill</text>
    <line x1="16" y1="48" x2="488" y2="48" stroke="#2b2b35" stroke-width="1.5"/>

    <!-- crosshair reticle: marks the exercise -->
    <g transform="translate(452 64)" opacity="0.55">
      <circle r="26" fill="none" stroke="#c9cdd6" stroke-width="1.5"/>
      <circle r="17" fill="none" stroke="#c9cdd6" stroke-width="1"/>
      <line x1="0" y1="-34" x2="0" y2="-28" stroke="#c9cdd6" stroke-width="1.5"/>
      <line x1="0" y1="28" x2="0" y2="34" stroke="#c9cdd6" stroke-width="1.5"/>
      <line x1="-34" y1="0" x2="-28" y2="0" stroke="#c9cdd6" stroke-width="1.5"/>
      <line x1="28" y1="0" x2="34" y2="0" stroke="#c9cdd6" stroke-width="1.5"/>
      <circle r="2.5" fill="#c9cdd6"/>
    </g>

    <text x="24" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f1f1f5">$ git push drill</text>
    <rect x="222" y="66" width="10" height="22" fill="#c9cdd6"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <g transform="translate(24 116)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#c9cdd6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9c9d2">rebase</text>
        <text x="196" y="13" fill="#8b8b98" text-anchor="end">clean</text>
      </g>
      <g transform="translate(24 142)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#c9cdd6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9c9d2">review</text>
        <text x="196" y="13" fill="#c9cdd6" text-anchor="end">passed</text>
      </g>
      <g transform="translate(24 168)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#c9cdd6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9c9d2">test</text>
        <text x="196" y="13" fill="#c9cdd6" text-anchor="end">passed</text>
      </g>
      <g transform="translate(24 194)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#c9cdd6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9c9d2">document</text>
        <text x="196" y="13" fill="#c9cdd6" text-anchor="end">synced</text>
      </g>
      <g transform="translate(24 220)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#c9cdd6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9c9d2">lint</text>
        <text x="196" y="13" fill="#c9cdd6" text-anchor="end">clean</text>
      </g>
    </g>

    <rect x="24" y="250" width="456" height="48" rx="10" fill="#16161d" stroke="#3a3a46" stroke-width="1.5"/>
    <text x="40" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#c9cdd6">→ push to origin, PR opened for you</text>
  </g>
</svg>
