<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How Squad works</title>
  <desc id="desc">Flow diagram: the commander chats with the sergeant at arms, which dispatches visible operators in isolated FOB worktrees and supervised session backends; strikes deliver PRs or approved local merges, recons deliver reports, and the sentry wakes the sergeant only on actionable events.</desc>

  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1018"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3FB950"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#wbg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#1E2733" stroke-width="1.5"/>

  <!-- lane 1: commander -->
  <g transform="translate(40 48)">
    <rect x="0" y="0" width="210" height="120" rx="12" fill="#11161F" stroke="#2D3542" stroke-width="1.5"/>
    <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">you</text>
    <text x="16" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">the commander</text>
    <text x="16" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">chat: requests,</text>
    <text x="16" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">decisions, "merge it"</text>
  </g>

  <line x1="252" y1="108" x2="306" y2="108" stroke="#3FB950" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- lane 2: squad -->
  <g transform="translate(312 48)">
    <rect x="0" y="0" width="250" height="120" rx="12" fill="#11161F" stroke="#3FB950" stroke-width="1.5"/>
    <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">Squad</text>
    <text x="16" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8B949E">sergeant at arms</text>
    <text x="16" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">intake, brief, dispatch,</text>
    <text x="16" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">merge authority</text>
  </g>

  <line x1="564" y1="108" x2="618" y2="108" stroke="#3FB950" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- lane 3: operators -->
  <g transform="translate(624 36)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">operators</text>
    <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">one visible agent per task</text>

    <g transform="translate(0 40)">
      <rect x="0" y="0" width="248" height="74" rx="10" fill="#0E141C" stroke="#1E2733" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#3FB950"/>
      <text x="30" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#E6EDF3">sq-task-1</text>
      <text x="30" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">tmux window</text>
      <text x="140" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">FOB worktree</text>
    </g>
    <g transform="translate(0 124)">
      <rect x="0" y="0" width="248" height="74" rx="10" fill="#0E141C" stroke="#1E2733" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#D29922"/>
      <text x="30" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#E6EDF3">sq-task-2</text>
      <text x="30" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">herdr / zellij / orca</text>
    </g>
    <g transform="translate(0 208)">
      <rect x="0" y="0" width="248" height="74" rx="10" fill="#0E141C" stroke="#1E2733" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#2D3542"/>
      <text x="30" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#E6EDF3">sq-task-3</text>
      <text x="30" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">queued</text>
    </g>
  </g>

  <!-- lane 4: delivery -->
  <g transform="translate(928 48)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">delivery</text>
    <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">commander decides</text>

    <g transform="translate(0 40)">
      <rect x="0" y="0" width="232" height="94" rx="10" fill="#11161F" stroke="#2D3542" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#3FB950"/>
      <text x="30" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#E6EDF3">strike</text>
      <text x="30" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">PR ready for review</text>
      <text x="30" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">or approved local merge</text>
    </g>
    <g transform="translate(0 148)">
      <rect x="0" y="0" width="232" height="94" rx="10" fill="#11161F" stroke="#2D3542" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#D29922"/>
      <text x="30" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#E6EDF3">recon</text>
      <text x="30" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">data/&lt;id&gt;/report.md</text>
      <text x="30" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#C9D1D9">+ decision inventory</text>
    </g>

    <text x="0" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">sentry wakes the sergeant</text>
    <text x="0" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8B949E">only on actionable events</text>
  </g>

  <line x1="876" y1="108" x2="926" y2="108" stroke="#3FB950" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="876" y1="188" x2="926" y2="188" stroke="#3FB950" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
