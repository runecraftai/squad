<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">sq-tasks: a task backlog that stays human-editable while agents work it</title>
  <desc id="desc">A backlog.md document shows queued and done tasks with checkboxes; a band below proves the byte-exact round-trip: render(parse(src)) equals src.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5f1"/>
      <stop offset="1" stop-color="#f1eee8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(56 108)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#78716c" letter-spacing="2">TASK &amp; BACKLOG CLI FOR AGENTS</text>
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="84" font-weight="700" fill="#1c1917">sq-tasks</text>
    <text x="0" y="134" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" fill="#44403c">A backlog that stays human-editable,</text>
    <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" fill="#44403c">even when agents do the editing.</text>
    <text x="0" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#78716c">backlog.md · byte-exact round-trip · TOON output</text>
  </g>

  <!-- right: backlog document -->
  <g id="backlog-card" transform="translate(640 44)">
    <rect width="500" height="292" rx="12" fill="#ffffff" stroke="#e5e1d8" stroke-width="1.5"/>
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#1c1917">backlog.md</text>
    <text x="476" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a8a29e" text-anchor="end">source of truth</text>
    <line x1="16" y1="46" x2="484" y2="46" stroke="#e5e1d8" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="24" y="78" font-weight="bold" fill="#1c1917">## In flight</text>
      <text x="24" y="104" fill="#44403c">- [ ] sq-lease-adopt  blocked-by fob-lease-t4</text>
      <text x="24" y="130" fill="#44403c">- [x] sm-idle-handoff-q8  done (pr #42)</text>
      <text x="24" y="158" font-weight="bold" fill="#1c1917">## Queued</text>
      <text x="24" y="184" fill="#44403c">- [ ] drill-release-validation  (priority 2)</text>
    </g>

    <rect x="24" y="206" width="452" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="250" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#2563eb" text-anchor="middle">render(parse(src)) === src</text>

    <text x="24" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#78716c">$ sq-tasks done sm-idle-handoff-q8 --pr &lt;url&gt;</text>
  </g>
</svg>
