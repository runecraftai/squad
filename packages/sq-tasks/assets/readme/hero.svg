<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">sq-tasks: an operations board task backlog that stays human-editable while agents work it</title>
  <desc id="desc">A backlog.md document shows queued and done tasks with checkboxes; a band below proves the byte-exact round-trip: render(parse(src)) equals src.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- unit insignia: star in a ring -->
  <g id="unit-patch" transform="translate(48 36)">
    <circle r="16" fill="#0d0d12" stroke="#3a3a46" stroke-width="1.5"/>
    <path d="M0 -8.5 L2.63 -2.63 L8.08 -2.63 L3.72 1.01 L5.31 6.87 L0 3.4 L-5.31 6.87 L-3.72 1.01 L-8.08 -2.63 L-2.63 -2.63 Z" fill="#c9cdd6"/>
  </g>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(56 108)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9b9ba8" letter-spacing="2">OPERATIONS BOARD · TASK BACKLOG</text>
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="84" font-weight="700" fill="#f1f1f5">sq-tasks</text>
    <text x="0" y="134" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" fill="#c9c9d2">A backlog that stays human-editable,</text>
    <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" fill="#c9c9d2">even when agents do the editing.</text>
    <text x="0" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b8b98">backlog.md · byte-exact round-trip · TOON output</text>
  </g>

  <!-- right: operations board -->
  <g id="backlog-card" transform="translate(640 44)">
    <rect width="500" height="292" rx="12" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#f1f1f5">backlog.md</text>
    <text x="476" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b8b98" text-anchor="end">order of battle</text>
    <!-- map marker: unit position -->
    <path d="M452 16 L462 26 L452 36 L442 26 Z" fill="none" stroke="#9aa0ac" stroke-width="1.5"/>
    <circle cx="452" cy="26" r="2" fill="#c9cdd6"/>
    <line x1="16" y1="46" x2="484" y2="46" stroke="#2b2b35" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="24" y="78" font-weight="bold" fill="#e6e8ee">## In flight</text>
      <text x="24" y="104" fill="#c9c9d2">- [ ] sq-lease-adopt  blocked-by fob-lease-t4</text>
      <text x="24" y="130" fill="#c9c9d2">- [x] sm-idle-handoff-q8  done (pr #42)</text>
      <text x="24" y="158" font-weight="bold" fill="#e6e8ee">## Queued</text>
      <text x="24" y="184" fill="#c9c9d2">- [ ] drill-release-validation  (priority 2)</text>
    </g>

    <rect x="24" y="206" width="452" height="42" rx="8" fill="#16161d" stroke="#3a3a46" stroke-width="1.5"/>
    <text x="250" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c9cdd6" text-anchor="middle">render(parse(src)) === src</text>

    <text x="24" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b8b98">$ sq-tasks done sm-idle-handoff-q8 --pr &lt;url&gt;</text>
  </g>
</svg>
