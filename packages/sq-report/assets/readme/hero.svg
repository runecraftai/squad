<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">sq-report: a review surface for agent-generated HTML artifacts</title>
  <desc id="desc">An HTML artifact card shows a plan heading, a paragraph with an annotated selection, a small diagram, and a queue-feedback bar; an annotation pin marks the selection.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171310"/>
      <stop offset="1" stop-color="#110e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(56 104)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#a99f92" letter-spacing="2">RICH HTML ARTIFACT REVIEW</text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="84" font-weight="700" fill="#efe7dd">sq-report</text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#d9cfc2">HTML is the new markdown.</text>
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#d9cfc2">Review rich artifacts, send feedback back.</text>
    <text x="0" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#a99f92">sq-report · annotate · poll · share</text>
  </g>

  <!-- right: artifact card -->
  <g id="artifact" transform="translate(636 40)">
    <rect width="510" height="300" rx="14" fill="#211b16" stroke="#3a3129" stroke-width="1.5"/>
    <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#d9cfc2">artifact.html</text>
    <text x="486" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#a99f92" text-anchor="end">sq-report</text>
    <line x1="16" y1="46" x2="494" y2="46" stroke="#3a3129" stroke-width="1.5"/>

    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#efe7dd">Product plan, Q3</text>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#b8ac9c">
      <text x="24" y="106">We ship the signup flow first, then the</text>
      <text x="24" y="128">billing page, then the dashboard.</text>
    </g>

    <rect x="24" y="94" width="196" height="17" rx="3" fill="#f59e0b" opacity="0.28"/>
    <circle cx="250" cy="101" r="11" fill="#f59e0b"/>
    <text x="250" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#171310" text-anchor="middle">1</text>

    <rect x="24" y="158" width="462" height="72" rx="8" fill="#1d1913" stroke="#3a3129" stroke-width="1.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <rect x="44" y="180" width="96" height="28" rx="6" fill="#2a231b" stroke="#4a3f31" stroke-width="1.5"/>
      <text x="92" y="198" fill="#d9cfc2" text-anchor="middle">signup</text>
      <text x="158" y="196" fill="#a99f92">→</text>
      <rect x="184" y="180" width="96" height="28" rx="6" fill="#2a231b" stroke="#4a3f31" stroke-width="1.5"/>
      <text x="232" y="198" fill="#d9cfc2" text-anchor="middle">billing</text>
      <text x="298" y="196" fill="#a99f92">→</text>
      <rect x="324" y="180" width="116" height="28" rx="6" fill="#2a231b" stroke="#4a3f31" stroke-width="1.5"/>
      <text x="382" y="198" fill="#d9cfc2" text-anchor="middle">dashboard</text>
      <text x="44" y="222" fill="#a99f92">editable mermaid diagram</text>
    </g>

    <rect x="24" y="248" width="462" height="40" rx="10" fill="#3b2a12" stroke="#8a641f" stroke-width="1.5"/>
    <text x="40" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fbbf24">Queue feedback → send to agent</text>
  </g>
</svg>
