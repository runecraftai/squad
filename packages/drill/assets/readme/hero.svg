<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">drill: push through a local AI validation gate</title>
  <desc id="desc">A terminal panel shows git push drill, then a pipeline of green checks for review, test, docs, and lint, ending in a push to origin and an opened pull request.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(64 104)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b949e" letter-spacing="2">LOCAL GIT QUALITY GATE</text>
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="96" font-weight="700" fill="#e6edf3">drill</text>
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#c9d1d9">Push through a validation pipeline.</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#c9d1d9">Land a clean PR, already reviewed.</text>
    <text x="0" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">git push drill · three ways in · agents</text>
  </g>

  <!-- right: terminal card -->
  <g id="terminal" transform="translate(632 36)">
    <rect width="504" height="300" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="24" r="6" fill="#febc2e"/>
    <circle cx="72" cy="24" r="6" fill="#28c840"/>
    <text x="112" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b949e">git push drill</text>
    <line x1="16" y1="48" x2="488" y2="48" stroke="#30363d" stroke-width="1.5"/>

    <text x="24" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e6edf3">$ git push drill</text>
    <rect x="222" y="66" width="10" height="22" fill="#3fb950"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <g transform="translate(24 116)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9d1d9">rebase</text>
        <text x="196" y="13" fill="#8b949e" text-anchor="end">clean</text>
      </g>
      <g transform="translate(24 142)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9d1d9">review</text>
        <text x="196" y="13" fill="#3fb950" text-anchor="end">passed</text>
      </g>
      <g transform="translate(24 168)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9d1d9">test</text>
        <text x="196" y="13" fill="#3fb950" text-anchor="end">passed</text>
      </g>
      <g transform="translate(24 194)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9d1d9">document</text>
        <text x="196" y="13" fill="#3fb950" text-anchor="end">synced</text>
      </g>
      <g transform="translate(24 220)">
        <path d="M4 7 L8 11 L14 3" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="13" fill="#c9d1d9">lint</text>
        <text x="196" y="13" fill="#3fb950" text-anchor="end">clean</text>
      </g>
    </g>

    <rect x="24" y="250" width="456" height="48" rx="10" fill="#1f6feb" opacity="0.16"/>
    <text x="40" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#58a6ff">→ push to origin, PR opened for you</text>
  </g>
</svg>
