<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">fob: Forward Operating Base - a reusable pool of isolated git worktrees for your agents</title>
  <desc id="desc">A repository feeds a pool of isolated worktrees under ~/.fob; one is in use by an agent in the field, one is ready, one is resetting, and exiting returns a worktree to the pool.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>

  <!-- unit insignia: star in a ring -->
  <g id="unit-patch" transform="translate(48 36)">
    <circle r="16" fill="#0d0d12" stroke="#3a3a46" stroke-width="1.5"/>
    <path d="M0 -8.5 L2.63 -2.63 L8.08 -2.63 L3.72 1.01 L5.31 6.87 L0 3.4 L-5.31 6.87 L-3.72 1.01 L-8.08 -2.63 L-2.63 -2.63 Z" fill="#c9cdd6"/>
  </g>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(64 110)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9b9ba8" letter-spacing="2">FOB · REUSABLE WORKTREE POOL</text>
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="48" font-weight="700" fill="#f1f1f5">Forward Operating Base</text>
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c9c9d2">A reusable pool of isolated git worktrees</text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c9c9d2">for agents. Deploy one per agent, on demand.</text>
    <text x="0" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b8b98">fob · fob get --lease · fob return</text>
  </g>

  <!-- right: forward base diagram -->
  <g id="pool-diagram" transform="translate(648 40)">
    <!-- repo card -->
    <rect width="488" height="52" rx="12" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
    <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f1f1f5">myproject</text>
    <text x="464" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b8b98" text-anchor="end">your repo</text>
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#8b8b98">start here, get a worktree</text>

    <!-- arrow into the base -->
    <line x1="244" y1="100" x2="244" y2="122" stroke="#c9cdd6" stroke-width="3"/>
    <path d="M238 118 L244 128 L250 118" fill="none" stroke="#c9cdd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="260" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#c9cdd6">fob</text>

    <!-- base container -->
    <rect y="136" width="488" height="216" rx="14" fill="#0d0d12" stroke="#2b2b35" stroke-width="1.5"/>
    <path d="M-6.5 12 L2 5.5 L10.5 12 L6.5 21.5 L-2.5 21.5 Z" fill="none" stroke="#c9cdd6" stroke-width="1.5" transform="translate(14 146)"/>
    <text x="34" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9b9ba8">FOB · ~/.fob</text>

    <!-- worktree cards as dog tags -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="24" y="176" width="440" height="44" rx="10" fill="#16161d" stroke="#c9cdd6" stroke-width="2"/>
      <circle cx="444" cy="198" r="4" fill="none" stroke="#4a4a58" stroke-width="1.5"/>
      <text x="44" y="203" font-size="18" fill="#f1f1f5">worktree 1</text>
      <text x="426" y="203" font-size="16" fill="#c9cdd6" text-anchor="end">in the field</text>

      <rect x="24" y="228" width="440" height="44" rx="10" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
      <circle cx="444" cy="250" r="4" fill="none" stroke="#4a4a58" stroke-width="1.5"/>
      <text x="44" y="255" font-size="18" fill="#f1f1f5">worktree 2</text>
      <text x="426" y="255" font-size="16" fill="#8b8b98" text-anchor="end">ready</text>

      <rect x="24" y="280" width="440" height="44" rx="10" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
      <circle cx="444" cy="302" r="4" fill="none" stroke="#4a4a58" stroke-width="1.5"/>
      <text x="44" y="307" font-size="18" fill="#f1f1f5">worktree 3</text>
      <text x="426" y="307" font-size="16" fill="#a08b5a" text-anchor="end">resetting</text>
    </g>

    <text x="24" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b8b98">exit → asset returns to the pool</text>
  </g>
</svg>
