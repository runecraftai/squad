<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">sq-gh: the GitHub CLI rebuilt for agents as clear-channel field radio</title>
  <desc id="desc">A terminal shows sq-gh issue list with three open issues and status dots, plus a next-step hint to view issue 42; signal arcs mark the comms channel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- unit insignia: star in a ring -->
  <g id="unit-patch" transform="translate(48 36)">
    <circle r="16" fill="#0d0d12" stroke="#3a3a46" stroke-width="1.5"/>
    <path d="M0 -8.5 L2.63 -2.63 L8.08 -2.63 L3.72 1.01 L5.31 6.87 L0 3.4 L-5.31 6.87 L-3.72 1.01 L-8.08 -2.63 L-2.63 -2.63 Z" fill="#c9cdd6"/>
  </g>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(64 104)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9b9ba8" letter-spacing="2">FIELD RADIO · GITHUB COMMS</text>
    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="96" font-weight="700" fill="#f1f1f5">sq-gh</text>
    <text x="0" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c9c9d2">Clear-channel comms with GitHub:</text>
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c9c9d2">token-efficient output, next steps included.</text>
    <text x="0" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b8b98">sq-gh · wraps gh · --hostname &lt;host&gt;</text>
  </g>

  <!-- right: terminal card -->
  <g id="terminal" transform="translate(636 40)">
    <rect width="510" height="300" rx="14" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="24" r="6" fill="#febc2e"/>
    <circle cx="72" cy="24" r="6" fill="#28c840"/>
    <text x="112" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b8b98">sq-gh issue list</text>
    <line x1="16" y1="48" x2="494" y2="48" stroke="#2b2b35" stroke-width="1.5"/>

    <!-- signal arcs: live channel -->
    <g transform="translate(472 62)" fill="none" stroke="#c9cdd6">
      <path d="M-13 8 A 15 15 0 0 1 13 8" stroke-width="2" opacity="0.85"/>
      <path d="M-22 12 A 26 26 0 0 1 22 12" stroke-width="2" opacity="0.5"/>
      <path d="M-31 16 A 37 37 0 0 1 31 16" stroke-width="2" opacity="0.25"/>
    </g>

    <text x="24" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#f1f1f5">$ sq-gh issue list</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <g transform="translate(24 120)">
        <circle cx="8" cy="7" r="5" fill="#c9cdd6"/>
        <text x="22" y="12" fill="#c9c9d2">42  flaky login test      [bug]</text>
        <text x="462" y="12" fill="#c9cdd6" text-anchor="end">OPEN</text>
      </g>
      <g transform="translate(24 148)">
        <circle cx="8" cy="7" r="5" fill="#c9cdd6"/>
        <text x="22" y="12" fill="#c9c9d2">41  dark mode toggle      [feat]</text>
        <text x="462" y="12" fill="#c9cdd6" text-anchor="end">OPEN</text>
      </g>
      <g transform="translate(24 176)">
        <circle cx="8" cy="7" r="5" fill="#c9cdd6"/>
        <text x="22" y="12" fill="#c9c9d2">39  cache layer           [perf]</text>
        <text x="462" y="12" fill="#c9cdd6" text-anchor="end">OPEN</text>
      </g>
    </g>

    <rect x="24" y="206" width="462" height="52" rx="10" fill="#16161d" stroke="#3a3a46" stroke-width="1.5"/>
    <text x="40" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c9cdd6">help[1]:</text>
    <text x="40" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c9cdd6">Run `sq-gh issue view 42` to inspect #42</text>
  </g>
</svg>
