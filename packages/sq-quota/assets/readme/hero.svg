<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">sq-quota: local agent-provider quota windows as one ammunition stock report</title>
  <desc id="desc">Three stock gauges show Claude at 64 percent remaining, Codex at 47, and Grok at 67, with pace markers and reset labels.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- unit insignia: star in a ring -->
  <g id="unit-patch" transform="translate(48 36)">
    <circle r="16" fill="#0d0d12" stroke="#3a3a46" stroke-width="1.5"/>
    <path d="M0 -8.5 L2.63 -2.63 L8.08 -2.63 L3.72 1.01 L5.31 6.87 L0 3.4 L-5.31 6.87 L-3.72 1.01 L-8.08 -2.63 L-2.63 -2.63 Z" fill="#c9cdd6"/>
  </g>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(56 104)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9b9ba8" letter-spacing="2">AMMUNITION LOGISTICS · LOCAL FIRST</text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="92" font-weight="700" fill="#f1f1f5">sq-quota</text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" fill="#c9c9d2">Know your stock before you spend.</text>
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23" fill="#c9c9d2">One call, every provider you run.</text>
    <text x="0" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b8b98">claude · codex · cursor · copilot · grok · kimi</text>
  </g>

  <!-- right: stock gauges -->
  <g id="gauges" transform="translate(640 52)">
    <g id="card-1">
      <rect width="500" height="84" rx="12" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
      <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#f1f1f5">claude</text>
      <text x="476" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c9cdd6" text-anchor="end">64% in stock</text>
      <rect x="24" y="48" width="380" height="8" rx="4" fill="#1d1d24"/>
      <rect x="24" y="48" width="243" height="8" rx="4" fill="#c9cdd6"/>
      <path d="M267 46 L274 52 L267 58 Z" fill="#c9cdd6"/>
      <rect x="214" y="44" width="3" height="16" rx="1.5" fill="#f1f1f5"/>
      <text x="24" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b8b98">session 82% · week 64% · pace behind</text>
    </g>
    <g id="card-2" transform="translate(0 96)">
      <rect width="500" height="84" rx="12" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
      <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#f1f1f5">codex</text>
      <text x="476" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#a08b5a" text-anchor="end">47% in stock</text>
      <rect x="24" y="48" width="380" height="8" rx="4" fill="#1d1d24"/>
      <rect x="24" y="48" width="179" height="8" rx="4" fill="#a08b5a"/>
      <path d="M203 46 L210 52 L203 58 Z" fill="#a08b5a"/>
      <rect x="232" y="44" width="3" height="16" rx="1.5" fill="#f1f1f5"/>
      <text x="24" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b8b98">session 58% · week 47% · pace ahead</text>
    </g>
    <g id="card-3" transform="translate(0 192)">
      <rect width="500" height="84" rx="12" fill="#111116" stroke="#2b2b35" stroke-width="1.5"/>
      <text x="24" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#f1f1f5">grok</text>
      <text x="476" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c9cdd6" text-anchor="end">67% in stock</text>
      <rect x="24" y="48" width="380" height="8" rx="4" fill="#1d1d24"/>
      <rect x="24" y="48" width="255" height="8" rx="4" fill="#c9cdd6"/>
      <path d="M279 46 L286 52 L279 58 Z" fill="#c9cdd6"/>
      <rect x="190" y="44" width="3" height="16" rx="1.5" fill="#f1f1f5"/>
      <text x="24" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b8b98">credits 67% · pace behind · resets monthly</text>
    </g>
  </g>
</svg>
