<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">fob: a reusable pool of clean git worktrees for your agents</title>
  <desc id="desc">A repository feeds a pool of isolated worktrees under ~/.fob; one is in use by an agent, one is ready, one is resetting, and exiting returns a worktree to the pool.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a14"/>
      <stop offset="1" stop-color="#0b120e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>

  <!-- left: identity block -->
  <g id="title-block" transform="translate(64 120)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#93b0a1" letter-spacing="2">GIT WORKTREE POOL</text>
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="96" font-weight="700" fill="#e6efe9">fob</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#c8d9d0">One clean worktree per agent,</text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#c8d9d0">from a pool that reuses itself.</text>
    <text x="0" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#93b0a1">fob · fob get --lease · fob return</text>
  </g>

  <!-- right: pool diagram -->
  <g id="pool-diagram" transform="translate(648 40)">
    <!-- repo card -->
    <rect width="488" height="52" rx="12" fill="#16241c" stroke="#2c4236" stroke-width="1.5"/>
    <text x="24" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e6efe9">myproject</text>
    <text x="464" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#93b0a1" text-anchor="end">your repo</text>
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#93b0a1">start here, get a worktree</text>

    <!-- arrow into the pool -->
    <line x1="244" y1="100" x2="244" y2="122" stroke="#34d399" stroke-width="3"/>
    <path d="M238 118 L244 128 L250 118" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="260" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#34d399">fob</text>

    <!-- pool container -->
    <rect y="136" width="488" height="216" rx="14" fill="#122019" stroke="#2c4236" stroke-width="1.5"/>
    <text x="24" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#93b0a1">pool · ~/.fob</text>

    <!-- worktree cards -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="24" y="176" width="440" height="44" rx="10" fill="#163526" stroke="#34d399" stroke-width="2"/>
      <text x="44" y="203" font-size="18" fill="#e6efe9">worktree 1</text>
      <text x="444" y="203" font-size="16" fill="#34d399" text-anchor="end">agent working</text>

      <rect x="24" y="228" width="440" height="44" rx="10" fill="#16241c" stroke="#2c4236" stroke-width="1.5"/>
      <text x="44" y="255" font-size="18" fill="#e6efe9">worktree 2</text>
      <text x="444" y="255" font-size="16" fill="#93b0a1" text-anchor="end">ready</text>

      <rect x="24" y="280" width="440" height="44" rx="10" fill="#16241c" stroke="#2c4236" stroke-width="1.5"/>
      <text x="44" y="307" font-size="18" fill="#e6efe9">worktree 3</text>
      <text x="444" y="307" font-size="16" fill="#fbbf24" text-anchor="end">resetting</text>
    </g>

    <text x="24" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#93b0a1">exit → worktree returns to the pool</text>
  </g>
</svg>
